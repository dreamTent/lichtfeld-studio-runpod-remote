[project]
name = "lichtfeld-runpod"
version = "0.1.0"
description = "Spin up a RunPod GPU, restore LichtFeld Studio, train, upload results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
lichtfeld-runpod = "lichtfeld_runpod.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lichtfeld_runpod*"]

[tool.setuptools.package-data]
lichtfeld_runpod = ["static/*"]
